name: Autopilot 6H Global Compatibility Matrix

on:
  schedule:
    # Exécution autonome toutes les 6 heures
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-matrix-agent:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configurer Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🤖 Exécuter le Moteur Agent & Générateur Multilingue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG || 'autocompat-21' }}
          AMAZON_TAG_US: ${{ secrets.AMAZON_TAG_US }}
          AMAZON_TAG_UK: ${{ secrets.AMAZON_TAG_UK }}
          AMAZON_TAG_DE: ${{ secrets.AMAZON_TAG_DE }}
          AMAZON_TAG_ES: ${{ secrets.AMAZON_TAG_ES }}
          AMAZON_TAG_IT: ${{ secrets.AMAZON_TAG_IT }}
          AMAZON_TAG_CA: ${{ secrets.AMAZON_TAG_CA }}
          AMAZON_TAG_JP: ${{ secrets.AMAZON_TAG_JP }}
          AMAZON_TAG_AU: ${{ secrets.AMAZON_TAG_AU }}
          AMAZON_TAG_NL: ${{ secrets.AMAZON_TAG_NL }}
          AMAZON_TAG_BR: ${{ secrets.AMAZON_TAG_BR }}
          SITE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m src.agent_engine
          python -m src.compta_manager

      - name: 🚀 Commit et Push des Nouvelles Matrices & Fichiers Docs
        run: |
          git config user.name "Global Matrix Autopilot Bot"
          git config user.email "action@github.com"
          git add docs/ data/ README.md compta_impots/
          if git diff --staged --quiet; then
            echo "Aucune modification à commiter."
          else
            git commit -m "🤖 Autopilot [$(date -u +'%Y-%m-%d %H:%M UTC')] Update Global Matrix & Multi-Country Broadcast"
            git push origin HEAD
          fi
